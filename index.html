<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NohYoon Seong — CV</title>
<meta name="description" content="NohYoon Seong — CV / Curriculum Vitae" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="page-header">
  <div class="header-top">
    <img id="photo" class="photo" alt="Portrait of NohYoon Seong" />
    <div class="header-main">
      <p class="kicker">Curriculum Vitae</p>
      <h1 id="name"></h1>
      <p class="affiliation" id="affiliation"></p>
    </div>
    <div class="header-controls">
      <button id="export-pdf" class="pdf-btn" type="button">Export PDF</button>
      <div class="lang-switch" role="group" aria-label="Language">
        <button id="lang-kr" class="lang-option" type="button" data-lang="kr">한국어</button>
        <button id="lang-en" class="lang-option" type="button" data-lang="en">English</button>
      </div>
    </div>
  </div>
  <div class="header-contact" id="header-contact">
    <p class="contact-links">
      <a id="email" href="#"></a>
      <span id="phone"></span>
      <a id="scholar" href="#" target="_blank" rel="noopener">Google Scholar ↗</a>
    </p>
  </div>
</header>

<nav class="section-nav" id="section-nav">
  <div class="section-nav-inner" id="section-nav-inner"></div>
</nav>

<main id="main"></main>

<footer class="page-footer">
  <p>&copy; <span id="year"></span> NohYoon Seong</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
